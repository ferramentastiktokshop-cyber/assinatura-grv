<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />

<title>Gerador de assinatura de e-mail | grvsoftware</title>
<meta name="description" content="Monte a assinatura de e-mail padrão da grvsoftware e copie o HTML pronto para o Gmail e o Outlook." />
<style>
  :root{
    --laranja:#F7521E;--cinza:#8E8E8E;--tinta:#1b1d1f;--texto:#4a4f55;--suave:#7c848c;
    --linha:#e3e6ea;--fundo:#f3f4f6;--alerta:#fff8ed;--alerta-borda:#f5cf9a;--alerta-texto:#8a5a10;
  }
  *{box-sizing:border-box;}
  body{margin:0;padding:32px 20px 64px;background:var(--fundo);color:var(--tinta);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.5;}
  .wrap{max-width:1120px;margin:0 auto;}
  header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px;}
  header img{height:36px;width:auto;display:block;margin-bottom:14px;}
  h1{font-size:24px;letter-spacing:-.02em;margin:0;font-weight:700;}
  .sub{margin:6px 0 0;color:var(--suave);font-size:14px;max-width:54ch;}
  .grid{display:grid;grid-template-columns:400px 1fr;gap:24px;align-items:start;}
  @media (max-width:900px){.grid{grid-template-columns:1fr;}}
  .painel{background:#fff;border:1px solid var(--linha);border-radius:12px;box-shadow:0 1px 2px rgba(16,24,40,.05);}
  .painel.form{padding:8px 20px 20px;}
  details{border-bottom:1px solid var(--linha);padding:16px 0;}
  details:last-of-type{border-bottom:0;}
  summary{cursor:pointer;list-style:none;font-weight:600;font-size:14px;display:flex;justify-content:space-between;align-items:center;}
  summary::-webkit-details-marker{display:none;}
  summary::after{content:"";width:8px;height:8px;border-right:2px solid #a6adb5;border-bottom:2px solid #a6adb5;transform:rotate(45deg);transition:transform .18s;margin-right:3px;}
  details[open] summary::after{transform:rotate(-135deg);}
  .campos{margin-top:16px;display:flex;flex-direction:column;gap:14px;}
  label.campo{display:block;}
  .rot{display:block;font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--suave);margin-bottom:6px;}
  input[type=text],select{width:100%;padding:9px 11px;border:1px solid #cfd4da;border-radius:7px;background:#fff;font:inherit;font-size:14px;color:var(--tinta);outline:none;transition:border-color .15s,box-shadow .15s;}
  input[type=text]:focus,select:focus{border-color:var(--laranja);box-shadow:0 0 0 3px rgba(247,82,30,.15);}
  input[type=color]{width:100%;height:38px;padding:2px;border:1px solid #cfd4da;border-radius:7px;background:#fff;cursor:pointer;}
  input[type=range]{width:100%;accent-color:var(--laranja);}
  .dica{display:block;margin-top:5px;font-size:12px;color:#98a0a8;}
  .cores{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .check{display:flex;align-items:center;gap:9px;font-size:14px;color:var(--texto);cursor:pointer;}
  .check input{width:16px;height:16px;accent-color:var(--laranja);}
  .aviso{display:block;padding:11px 12px;border:1px solid var(--alerta-borda);background:var(--alerta);border-radius:8px;font-size:12.5px;line-height:1.45;color:var(--alerta-texto);}
  .ok{font-size:12.5px;color:#1f7a4d;word-break:break-all;margin:0;}
  .barra{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:1px solid var(--linha);}
  .abas{display:flex;gap:4px;background:#f1f3f5;padding:4px;border-radius:9px;}
  .abas button{border:0;background:transparent;font:inherit;font-size:14px;font-weight:500;color:var(--suave);padding:6px 13px;border-radius:6px;cursor:pointer;}
  .abas button[aria-selected=true]{background:#fff;color:var(--tinta);box-shadow:0 1px 2px rgba(16,24,40,.08);}
  .acoes{display:flex;flex-wrap:wrap;gap:8px;}
  .btn{font:inherit;font-size:14px;padding:8px 13px;border-radius:7px;cursor:pointer;border:1px solid #cfd4da;background:#fff;color:var(--texto);transition:background .15s;}
  .btn:hover{background:#f7f8f9;}
  .btn.primario{background:var(--laranja);border-color:var(--laranja);color:#fff;font-weight:600;}
  .btn.primario:hover{background:#e04616;}
  .btn.largo{width:100%;}
  .corpo{padding:20px;}
  .palco{border:1px solid var(--linha);border-radius:9px;padding:30px 26px;background:#fff;overflow-x:auto;}
  pre{margin:0;max-height:560px;overflow:auto;background:#14181d;color:#e6edf3;padding:16px;border-radius:9px;font-size:12px;line-height:1.6;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-word;}
  .oculto{display:none;}
  .fora{position:fixed;left:0;top:0;height:0;overflow:hidden;opacity:0;pointer-events:none;}
</style>
</head>

<script>
/* ---------------- helpers ---------------- */
const esc = (s="") => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const digitos = (s="") => String(s).replace(/\D/g,"");
const comProtocolo = (u="") => { u=String(u).trim(); return !u ? "" : (/^https?:\/\//i.test(u) ? u : "https://"+u); };
const barra = (u="") => { u=String(u).trim(); return u && !u.endsWith("/") ? u+"/" : u; };

const normalizarImagem = (url="") => {
  const u = comProtocolo(url);
  if(!u) return "";
  const drive = u.match(/drive\.google\.com\/file\/d\/([^/]+)/) || u.match(/drive\.google\.com\/open\?id=([^&]+)/) || u.match(/drive\.google\.com\/uc\?[^]*id=([^&]+)/);
  if(drive) return "https://lh3.googleusercontent.com/d/"+drive[1];
  if(/dropbox\.com/.test(u)) return u.replace(/[?&]dl=\d/,"") + (u.includes("?") ? "&raw=1" : "?raw=1");
  return u;
};

const iconeSvg = (key, cor, tam=18) => {
  const e = 0.58, off = ((24 - 24*e)/2).toFixed(2);
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="'+tam+'" height="'+tam+'" style="display:block;">'+
    '<circle cx="12" cy="12" r="12" fill="'+cor+'" style="fill:'+cor+';"/>'+
    '<g transform="translate('+off+','+off+') scale('+e+')"><path d="'+GLIFOS[key]+'" fill="#ffffff" style="fill:#ffffff;"/></g></svg>';
};

/* ---------------- gerador ---------------- */
const SANS = "Arial, Helvetica, sans-serif";

function montar(modo){
  const marca = key => modo === "preview"
    ? iconeSvg(key, d.corMarca)
    : '<img src="'+esc(barra(comProtocolo(d.baseIcones))+key+".png")+'" width="18" height="18" alt="" style="display:block;border:0;" />';

  const linha = (key, href, texto) => {
    if(!texto) return "";
    const conteudo = href
      ? '<a href="'+esc(href)+'" style="color:'+d.corTexto+';font-family:'+SANS+';font-size:14px;text-decoration:none;">'+esc(texto)+'</a>'
      : '<span style="color:'+d.corTexto+';font-family:'+SANS+';font-size:14px;">'+esc(texto)+'</span>';
    return '\n          <tr>\n' +
      '            <td style="padding:5px 12px 5px 0;vertical-align:middle;width:18px;">'+marca(key)+'</td>\n' +
      '            <td style="padding:5px 0;vertical-align:middle;">'+conteudo+'</td>\n          </tr>';
  };

  const contatos = [
    linha("site", comProtocolo(d.site), d.site),
    linha("telefone", "https://wa.me/"+digitos(d.telefone), d.telefone),
    linha("email", "mailto:"+d.email, d.email),
    linha("local", "", d.cidade)
  ].filter(Boolean).join("");

  const blocoContatos = contatos
    ? '<table cellpadding="0" cellspacing="0" border="0" role="presentation" style="border-collapse:collapse;margin-top:16px;">'+contatos+'\n        </table>'
    : "";

  const logoSrc = normalizarImagem(d.logoUrl);
  const imgLogo = modo === "preview"
    ? '<img src="'+esc(logoSrc || LOGO_EMBUTIDA)+'" width="'+d.logoLargura+'" alt="grvsoftware" onerror="this.src=\''+LOGO_EMBUTIDA+'\'" style="display:block;border:0;max-width:'+d.logoLargura+'px;height:auto;" />'
    : '<img src="'+esc(logoSrc)+'" width="'+d.logoLargura+'" alt="grvsoftware" style="display:block;border:0;max-width:'+d.logoLargura+'px;height:auto;" />';

  const regua = d.mostrarRegua
    ? '\n    <td width="2" style="width:2px;min-width:2px;background-color:'+d.corMarca+';font-size:0;line-height:0;">&nbsp;</td>'
    : "";

  const cargo = d.cargo
    ? '\n        <div style="font-family:'+SANS+';font-size:13px;font-weight:bold;letter-spacing:2px;text-transform:uppercase;color:'+d.corMarca+';margin-top:8px;">'+esc(d.cargo)+'</div>'
    : "";

  const saudacao = d.mostrarSaudacao
    ? '<div style="font-family:'+SANS+';font-size:14px;color:'+d.corTexto+';margin-bottom:16px;">'+esc(d.saudacao)+'</div>'
    : "";

  return saudacao +
'<table cellpadding="0" cellspacing="0" border="0" role="presentation" style="border-collapse:collapse;">\n' +
'  <tr>\n' +
'    <td style="vertical-align:middle;padding-right:26px;text-align:center;">'+imgLogo+'</td>' + regua + '\n' +
'    <td style="vertical-align:middle;padding-left:26px;">\n' +
'        <div style="font-family:'+d.fonteNome+';font-size:'+d.tamanhoNome+'px;line-height:1.15;color:'+d.corNome+';">'+esc(d.nome)+'</div>' + cargo + '\n' +
'        '+blocoContatos+'\n' +
'    </td>\n' +
'  </tr>\n' +
'</table>';
}

    {k:"mostrarSaudacao", r:"Incluir despedida acima da assinatura", tipo:"check"},
    {k:"saudacao", r:"Texto da despedida", ph:"Atenciosamente,"}
  ]}
];

function campoHtml(c){
  if(c.tipo==="avisos") return '<div id="avisos-logo"></div>';
  if(c.tipo==="nota") return '<p class="dica" style="margin:0">'+c.texto+'</p>';
  if(c.tipo==="cores") return '<div class="cores">'+
    [["corMarca","Marca"],["corNome","Nome"],["corTexto","Contatos"]].map(([k,r])=>
      '<label class="campo"><span class="rot">'+r+'</span><input type="color" data-k="'+k+'" value="'+ler(k)+'" /></label>').join("")+'</div>';
  if(c.tipo==="check") return '<label class="check"><input type="checkbox" data-k="'+c.k+'"'+(ler(c.k)?" checked":"")+' /> '+c.r+'</label>';
  if(c.tipo==="range") return '<label class="campo"><span class="rot">'+c.r+': <span data-eco="'+c.k+'">'+ler(c.k)+'</span>px</span>'+
    '<input type="range" min="'+c.min+'" max="'+c.max+'" data-k="'+c.k+'" value="'+ler(c.k)+'" /></label>';
  if(c.tipo==="select") return '<label class="campo"><span class="rot">'+c.r+'</span><select data-k="'+c.k+'">'+
    c.opcoes.map(([v,r])=>'<option value="'+esc(v)+'"'+(ler(c.k)===v?" selected":"")+'>'+r+'</option>').join("")+'</select></label>';
  return '<label class="campo"><span class="rot">'+c.r+'</span><input type="text" data-k="'+c.k+'" value="'+esc(ler(c.k))+'" placeholder="'+esc(c.ph||"")+'" />'+
    (c.dica?'<span class="dica">'+c.dica+'</span>':"")+'</label>';
}

function desenharForm(){
  document.getElementById("form").innerHTML = SECOES.map(s =>
    '<details'+(s.aberto?" open":"")+'><summary>'+s.t+'</summary><div class="campos">'+
    s.campos.map(campoHtml).join("")+'</div></details>').join("");
  avisosLogo();
}

function avisosLogo(){
  const alvo = document.getElementById("avisos-logo");
  if(!alvo) return;
  const bruto = d.logoUrl, url = normalizarImagem(bruto), itens = [];
  if(bruto && !pareceImagem(url))
    itens.push('<div class="aviso">Este link parece apontar para uma página, não para o arquivo de imagem. Abra a imagem sozinha no navegador, copie o endereço dela e cole aqui.</div>');
  if(bruto && /\.(webp|svg)(\?|$)/i.test(bruto))
    itens.push('<div class="aviso">O Outlook no Windows não renderiza webp nem svg em e-mail. Use o arquivo PNG.</div>');
  if(bruto && /-[A-Za-z0-9_]{8}\.(png|jpe?g|webp|svg)/.test(bruto))
    itens.push('<div class="aviso">Esse nome de arquivo tem um código gerado no build do site. Ele muda na próxima publicação e a logo some das assinaturas já enviadas. Hospede a imagem em um endereço fixo.</div>');
  if(bruto && url !== comProtocolo(bruto))
    itens.push('<p class="ok">Link convertido para link direto: '+esc(url)+'</p>');
  alvo.innerHTML = itens.join("");
}

/* ---------------- render ---------------- */
function render(){
  document.getElementById("palco").innerHTML = montar("preview");
  const html = montar("email");
  document.getElementById("codigo").textContent = html;
  document.getElementById("fora").innerHTML = html;
  avisosLogo();
}

/* ---------------- eventos ---------------- */
document.getElementById("form").addEventListener("input", e => {
  const el = e.target, k = el.dataset.k;
  if(!k) return;
  if(el.type === "checkbox") gravar(k, el.checked);
  else if(el.type === "range"){
    gravar(k, Number(el.value));
    const eco = document.querySelector('[data-eco="'+k+'"]');
    if(eco) eco.textContent = el.value;
  } else gravar(k, el.value);
  render();
});

document.getElementById("limpar").addEventListener("click", () => {
  ["nome","cargo","site","telefone","email","cidade"].forEach(k => gravar(k,""));
  desenharForm(); render();
});

const abaPreview = document.getElementById("aba-preview");
const abaCodigo  = document.getElementById("aba-codigo");
function trocarAba(codigo){
  abaPreview.setAttribute("aria-selected", String(!codigo));
  abaCodigo.setAttribute("aria-selected", String(codigo));
  document.getElementById("palco").classList.toggle("oculto", codigo);
  document.getElementById("codigo").classList.toggle("oculto", !codigo);
}
abaPreview.addEventListener("click", () => trocarAba(false));
abaCodigo.addEventListener("click", () => trocarAba(true));

function piscar(btn, texto){
  const antes = btn.textContent;
  btn.textContent = texto;
  setTimeout(() => { btn.textContent = antes; }, 1800);
}

document.getElementById("copiarCodigo").addEventListener("click", async e => {
  try{ await navigator.clipboard.writeText(montar("email")); piscar(e.target,"Código copiado"); }
  catch{ piscar(e.target,"Não deu para copiar"); }
});

document.getElementById("copiarAssinatura").addEventListener("click", async e => {
  const html = montar("email");
  try{
    if(window.ClipboardItem && navigator.clipboard.write){
      await navigator.clipboard.write([new ClipboardItem({
        "text/html": new Blob([html],{type:"text/html"}),
        "text/plain": new Blob([d.nome],{type:"text/plain"})
      })]);
    } else {
      const sel = window.getSelection(), r = document.createRange();
      r.selectNodeContents(document.getElementById("fora"));
      sel.removeAllRanges(); sel.addRange(r);
      document.execCommand("copy"); sel.removeAllRanges();
    }
    piscar(e.target,"Assinatura copiada");
  } catch { piscar(e.target,"Não deu para copiar"); }
});

document.getElementById("baixar").addEventListener("click", () => {
  const doc = '<!DOCTYPE html><html><head><meta charset="utf-8"></head><body>'+montar("email")+'</body></html>';
  const url = URL.createObjectURL(new Blob([doc],{type:"text/html"}));
  const a = document.createElement("a");
  a.href = url;
  a.download = "assinatura-"+(d.nome||"email").toLowerCase().replace(/\s+/g,"-")+".html";
  a.click();
  URL.revokeObjectURL(url);
});

desenharForm();
render();
</script>
